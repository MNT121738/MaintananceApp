<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maintenance Track | BIOTEK</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('mkpi-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --panel:#FFFFFF; --ink:#1E293B; --ink2:#334155; --muted:#64748B; --line:#E3E8EF; --soft:#F1F4F9;
  --blue:#2563EB; --blue-d:#1D4ED8; --blue-l:#EEF4FF; --head:#1E55C8;
  --red:#C62828; --red-l:#FDECEC; --orange:#C2570C; --orange-l:#FFF1E6; --green:#15803D; --green-l:#E7F6EC;
  --side:#FFFFFF; --sec:#3D6BD0;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  /* aliases used by charts */
  --steel:#2563EB; --steel2:#93B4F5; --amber:#E08A12; --ok:#15803D; --bad:#C62828;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --panel:#161E2E; --ink:#E2E8F0; --ink2:#CBD5E1; --muted:#94A3B8; --line:#263247; --soft:#1C2638;
  --blue:#4F86F0; --blue-d:#7FA6F5; --blue-l:#1C2A4A; --head:#7FA6F5; --red:#F07167; --red-l:#3A1F25; --orange:#F4A259; --orange-l:#3A2A1C; --green:#4ADE80; --green-l:#17301F;
  --side:#121A28; --sec:#7FA6F5; --steel:#5B8DEF; --steel2:#2F4D85; --amber:#F4A259; --ok:#4ADE80; --bad:#F07167;
}}
:root[data-theme="dark"]{
  --bg:#0F1522; --panel:#161E2E; --ink:#E2E8F0; --ink2:#CBD5E1; --muted:#94A3B8; --line:#263247; --soft:#1C2638;
  --blue:#4F86F0; --blue-d:#7FA6F5; --blue-l:#1C2A4A; --head:#7FA6F5; --red:#F07167; --red-l:#3A1F25; --orange:#F4A259; --orange-l:#3A2A1C; --green:#4ADE80; --green-l:#17301F;
  --side:#121A28; --sec:#7FA6F5; --steel:#5B8DEF; --steel2:#2F4D85; --amber:#F4A259; --ok:#4ADE80; --bad:#F07167;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);min-height:66px}
.logo{width:34px;height:34px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.brand b{display:block;font-weight:700;font-size:15px;line-height:1.1}
.brand span{font-size:12.5px;color:var(--muted)}
.nav{flex:1;overflow:auto;padding:6px 8px 12px}
.nav h6{margin:16px 8px 6px;font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--sec)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--ink2);text-decoration:none;font-size:14px;margin:1px 0}
.nav a svg{width:16px;height:16px;flex:none;color:var(--muted)}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--blue-l);color:var(--blue);font-weight:600}
.nav a.on svg{color:var(--blue)}
.nav a .bdg{margin-left:auto;background:var(--red-l);color:var(--red);font-size:11.5px;font-weight:600;border-radius:9px;padding:0 7px;line-height:18px}
.sfoot{border-top:1px solid var(--line);padding:14px 16px 12px;font-size:12px;color:var(--ink2)}
.logo-img{margin:0 0 12px;border-radius:6px;line-height:0}
.logo-img img{display:block;width:100%;max-width:190px;height:auto}
:root[data-theme="dark"] .logo-img{background:#fff;padding:6px 8px;display:inline-block}
.word{font-size:26px;font-weight:300;letter-spacing:.32em;color:var(--blue-d);margin-bottom:14px;line-height:1}
.word b{font-weight:700;border:2px solid var(--blue-d);padding:0 3px;margin-right:2px;letter-spacing:0}
.sfoot p{margin:0 0 3px}
.sfoot .copy{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.5}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--orange)}
.dot.cloud{background:var(--green)}
/* top bar */
.col{min-width:0;display:flex;flex-direction:column}
.top{background:var(--blue);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 26px;min-height:58px;position:sticky;top:0;z-index:5}
.top b{font-size:15.5px;font-weight:700;display:block}
.top span{font-size:12.5px;opacity:.9}
.tright{display:flex;align-items:center;gap:16px}
.tsel{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#fff}
.tsel select{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;font-weight:600;border-radius:7px;min-height:32px;padding:4px 8px}
.tsel select option{color:#1E293B;background:#fff}
.tbtn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:7px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500;min-height:32px}
.tbtn:hover{background:rgba(255,255,255,.26)}
.tbtn svg{width:16px;height:16px}
:root[data-theme="dark"] .top{background:#1A3E8C}
.user{display:flex;gap:10px;align-items:center;text-align:left}
.av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:600;font-size:12.5px}
.user b{font-size:14px}.user span{font-size:12px}
main{padding:22px 26px 60px;min-width:0}
/* page head */
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.head h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.head p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:780px}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px 16px;display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-end;margin-bottom:16px}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label.f,.fg{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink);font-weight:500}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px;min-height:34px;font-weight:400}
input::placeholder{color:#94A3B8}
input[type=number]{text-align:right}
textarea{min-height:90px;resize:vertical}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--ink2);font-size:13.5px;min-height:28px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.08)}
.seg button.on.g{background:var(--green-l);color:var(--green)}
.seg button.on.r{background:var(--red-l);color:var(--red)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 13px;cursor:pointer;min-height:34px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:#B8C2D1}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;padding:8px 16px}
.btn.pri:hover{background:var(--blue-d)}
.btn svg{width:15px;height:15px}
.btn.danger{color:var(--red)}
.btn.sm{padding:3px 10px;min-height:28px;font-size:13px}
h2{font-size:16px;font-weight:700;margin:24px 0 10px;color:var(--ink)}
h2 small{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
h2:first-child{margin-top:0}
/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:10px 14px 11px}
.tile .l{font-size:13px;color:var(--ink2)}
.tile .v{font-size:22px;font-weight:700;margin-top:2px;white-space:nowrap;color:var(--blue)}
.tile .s{font-size:12px;color:var(--muted);margin-top:1px}
.tile.ok{border-left-color:var(--green)}.tile.ok .v{color:var(--green)}
.tile.bad{border-left-color:var(--red)}.tile.bad .v{color:var(--red)}
.tile.warn{border-left-color:var(--orange)}.tile.warn .v{color:var(--orange)}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-weight:600;font-size:12.5px}
.pill.ok{background:var(--green-l);color:var(--green)}.pill.bad{background:var(--red-l);color:var(--red)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--panel);font-weight:600;font-size:13.5px;color:var(--head);position:sticky;top:0;box-shadow:inset 0 -1px 0 var(--line)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td:first-child{font-weight:600}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tr.tot td{font-weight:700;background:var(--soft);border-top:1px solid var(--line)}
tr.sec td{font-weight:700;font-size:13px;color:var(--blue);background:var(--blue-l);padding-top:8px;padding-bottom:8px;letter-spacing:.02em}
td.wrap{white-space:normal;min-width:240px;max-width:420px;font-weight:400}
.empty{padding:30px;text-align:center;color:var(--muted)}
.muted{color:var(--muted);font-weight:400}
/* meter */
.meter{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;padding:16px 20px 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 36px;align-items:end}
.meter.over{border-left-color:var(--red)}
.meter .big{font-size:58px;font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--blue)}
.meter.over .big{color:var(--red)}
.meter .big small{font-size:24px;font-weight:600;margin-right:2px;color:var(--muted)}
.meter .cap{font-size:13px;color:var(--ink2);margin-bottom:4px}
.track{position:relative;height:12px;background:var(--soft);border-radius:6px;margin:30px 0 6px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:6px}
.fill.bad{background:var(--red)}
.tick{position:absolute;top:-7px;bottom:-7px;width:3px;border-radius:2px;background:var(--amber)}
.tick span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:12px;color:var(--orange);white-space:nowrap;font-weight:600;margin-bottom:2px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.meter .side2{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.meter .side2 div b{display:block;font-size:18px;font-weight:700;color:var(--ink)}
.meter .side2 div{font-size:12.5px;color:var(--muted)}
.chart{position:relative;height:280px}
.note{border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:8px;background:var(--panel);padding:10px 14px;margin-top:12px}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0;width:min(900px,96vw);max-height:92vh;border-radius:12px;box-shadow:0 20px 50px rgba(15,23,42,.25)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dh h3{margin:0;font-size:18px;font-weight:700}
.db{padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.db .w2{grid-column:span 2}.db .full{grid-column:1/-1}
.df{display:flex;justify-content:space-between;gap:10px;padding:12px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
.calc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:20px;background:var(--blue-l);border-radius:8px;padding:10px 14px;font-size:13.5px}
.calc b{font-size:16px;color:var(--blue)}
.thead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px}.thead h2{margin:0}
.btn.pri.dz{background:var(--red);border-color:var(--red)}
tr.err td{background:var(--red-l)!important}
.wono{display:flex;gap:6px;width:100%}.wono input{flex:1;min-width:0}
.btn.dots{width:38px;min-width:38px;padding:0;justify-content:center}.btn.dots svg{width:18px;height:18px}
.btn.dots[aria-expanded="true"]{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.smenu{position:fixed;z-index:220;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(15,23,42,.22);padding:6px;max-height:70vh;overflow:auto}
.smenu-h{font-size:12px;color:var(--muted);padding:6px 10px 8px}
.smenu>button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.smenu>button b{font-variant-numeric:tabular-nums;color:var(--blue)}
.smenu>button span{font-size:12.5px;color:var(--muted);text-align:right}
.smenu>button:hover,.smenu>button:focus{background:var(--soft);outline:none}
.smenu>button.on{background:var(--blue-l)}.smenu>button.on span::after{content:" ✓";color:var(--green);font-weight:700}
.smenu-f{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;display:flex;flex-direction:column}
.smenu-f button{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:7px;color:var(--blue);cursor:pointer;font:inherit;font-size:13px}
.smenu-f button:hover,.smenu-f button:focus{background:var(--soft);outline:none}
.legend{font-size:12.5px;color:var(--muted);margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1E293B;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:50}
#toast.show{opacity:1}
.pk-wrap{position:relative;display:inline-block;max-width:100%}
.pk-in{width:100%;padding-right:30px!important;cursor:pointer}
.pk-ic{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.pk-ic svg{width:16px;height:16px;display:block}
.pk{position:fixed;z-index:200;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(15,23,42,.22);padding:10px;font-size:13.5px}
.pk.date{width:292px}.pk.time{width:318px}
.pk button{border:0;background:transparent;cursor:pointer;border-radius:6px;color:var(--ink);font:inherit}
.pk button:hover{background:var(--soft)}
.pk-h{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.pk-h select{min-height:30px;padding:2px 6px;font-weight:600;flex:1}
.pk-h .nb{width:30px;height:30px;font-size:20px;line-height:1;color:var(--blue)}
.pk-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.pk-g span{font-size:11.5px;color:var(--muted);padding:2px 0 4px}
.pk-g .d{height:34px;font-variant-numeric:tabular-nums}
.pk-g .d.o{color:var(--muted);opacity:.55}
.pk-g .d.td{box-shadow:inset 0 0 0 1.5px var(--blue);font-weight:600}
.pk .sel,.pk .sel:hover{background:var(--blue)!important;color:#fff!important;font-weight:600}
.pk-f{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.pk-f button{background:var(--blue-l);color:var(--blue);padding:4px 10px;font-weight:600;font-size:12.5px}
.pk-tip{font-size:11.5px;color:var(--muted);margin-top:6px}
.pk-lab{font-size:12px;color:var(--muted);margin:2px 0 4px;font-weight:600}
.pk-hr{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.pk.time{width:280px}
.wh-wrap{display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:2px 4px}
.wh-col{flex:1;max-width:100px}
.wh-lab{font-size:12px;font-weight:600;color:var(--muted);text-align:center;height:20px}
.wh-box{position:relative;height:180px;border-radius:10px;background:var(--soft);overflow:hidden}
.wh-band{position:absolute;left:4px;right:4px;top:72px;height:36px;border-radius:8px;background:var(--panel);box-shadow:0 0 0 1.5px var(--blue);pointer-events:none}
.wheel{position:relative;height:180px;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-padding-top:72px;scrollbar-width:none;cursor:grab;outline:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel:focus-visible{box-shadow:inset 0 0 0 2px var(--amber);border-radius:10px}
.wheel:active{cursor:grabbing}
.wi{height:36px;line-height:36px;text-align:center;scroll-snap-align:start;font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums;user-select:none}
.wi.pad{scroll-snap-align:none}
.wi.on{color:var(--blue);font-weight:700;font-size:20px}
.wh-colon{font-size:22px;font-weight:700;color:var(--blue);height:180px;line-height:180px;padding-top:0}
.pk-f .pk-done{margin-left:auto;background:var(--blue);color:#fff}
.pk-f .pk-done:hover{background:var(--blue-d)}
.pk-mi{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.pk-hr button,.pk-mi button{height:32px;background:var(--soft);font-variant-numeric:tabular-nums}
.pk-hr button.night{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:12px;align-items:flex-start}
.step>b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-size:13px}
.step .st{font-weight:600}
.usum{margin-top:16px;border:1px solid var(--line);border-left:3px solid var(--green);border-radius:8px;padding:10px 14px;background:var(--green-l)}
.usum.warn{border-left-color:var(--orange);background:var(--orange-l)}
.usum ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips-h{font-size:13px;font-weight:600;margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--blue-l);color:var(--blue);border-radius:16px;padding:4px 11px;font-size:13px;font-weight:500;cursor:pointer;min-height:30px}
.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--green-l);color:var(--green);border-color:var(--green)}
.chip small{opacity:.75}
.chips-empty{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.pick-list{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
.pick-row{display:grid;grid-template-columns:22px 1fr auto 80px;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pick-row:last-child{border-bottom:0}.pick-row:hover{background:var(--soft)}
.pick-row input[type=number]{min-height:28px;padding:2px 6px}
.ss-wrap{position:relative;display:block;width:100%;max-width:100%}
.ss-in{width:100%;padding-right:30px!important;cursor:text;text-overflow:ellipsis}
.ss-ic{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.ss-ic svg{width:16px;height:16px;display:block}
.ss{position:fixed;z-index:210;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(15,23,42,.22);overflow:hidden;font-size:14px}
.ss-h{font-size:12px;color:var(--muted);padding:7px 12px;border-bottom:1px solid var(--line);background:var(--soft)}
.ss-l{overflow:auto}
.ss-g{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sec);padding:8px 12px 3px}
.ss-o{padding:7px 12px;cursor:pointer;line-height:1.35}
.ss-o:hover{background:var(--soft)}
.ss-o.act{background:var(--blue-l);color:var(--blue)}
.ss-o.cur{font-weight:600}
.ss-o.cur::after{content:" ✓";color:var(--green)}
.ss-o mark{background:#FDE68A;color:inherit;border-radius:2px;padding:0 1px}
:root[data-theme="dark"] .ss-o mark{background:#7C5E10}
.ss-none{padding:14px 12px;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);min-width:0}
  .brand{border:0;min-height:0}
  .nav{display:flex;overflow-x:auto;padding:0 8px 8px;gap:2px;min-width:0}.nav h6{display:none}
  .nav a{white-space:nowrap}
  .sfoot{display:none}
  .top{padding:10px 14px}.top span,.user span,.tbtn em{display:none}.tsel{font-size:0;gap:0}.top>div:first-child{display:none}.user div:last-child{display:none}
  main{padding:18px 14px 50px}
  .meter{grid-template-columns:1fr}.meter .big{font-size:48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

async function save(msg){
  calc();lsSet(LS,JSON.stringify(S));
  if(MODE==='cloud'){
    setSync('Saving…');
    try{
      const r=await api('PUT',{baseVersion:S.version||0,data:S});
      if(r.status===409&&r.j&&r.j.data){S=r.j.data;normalize();calc();lsSet(LS,JSON.stringify(S));setSync();render();toast('Someone else saved first. Their latest data is now shown; please re-enter your change.');return false}
      if(r.j&&r.j.ok){S.version=r.j.version;lsSet(LS,JSON.stringify(S))}else throw new Error('save');
    }catch(e){setSync('Not saved online, kept in this browser');toast('Could not reach the server. The change is kept in this browser only.');render();return false}
  }
  setSync();render();if(msg)toast(msg);return true;
}
window.addEventListener('focus',async()=>{
  if(MODE!=='cloud'||$('#dlg').open)return;
  try{const r=await api('GET');if(r.j&&r.j.ok&&r.j.data&&r.j.data.version!==S.version){S=r.j.data;normalize();calc();lsSet(LS,JSON.stringify(S));render()}}catch(e){}
});

/* ---------- calculations (same logic as the Excel workbook) ---------- */
function calc(){
  const R=S.rates,spareBy={};
  S.spareIssues.forEach(s=>spareBy[s.wo]=(spareBy[s.wo]||0)+num(s.qty)*num(s.rate));
  const M=Object.fromEntries(S.machines.map(m=>[m.no,m]));
  C.wos=S.wos.map(w=>{
    const wh=hrsBetween(w.start,w.end);
    const crew=CATS.reduce((s,[k])=>s+num(w[k]),0);
    const mp=CATS.reduce((s,[k,c])=>s+num(w[k])*num(R[c]),0)*wh;
    const spare=spareBy[w.no]||0, oth=num(w.cons)+num(w.ext)+num(w.other);
    return{...w,name:M[w.machine]?.name||'',dept:M[w.machine]?.dept||'',crew,wh,manHrs:crew*wh,mp,spare,othCost:oth,total:mp+spare+oth,dt:hrsBetween(w.dtStart,w.dtEnd)};
  }).sort((a,b)=>a.date.localeCompare(b.date)||a.no.localeCompare(b.no));
  C.prod=S.production.map(p=>({...p,good:num(p.total)-num(p.rej),name:M[p.machine]?.name||''}));
}
const inR=(d,f,t)=>d>=f&&d<=t;
const wosIn=(f,t)=>C.wos.filter(w=>inR(w.date,f,t));
function prodIn(f,t,machine){
  const r={total:0,rej:0,good:0};
  C.prod.forEach(p=>{if(!inR(p.date,f,t))return;if(machine?p.machine!==machine:p.count==='N')return;r.total+=num(p.total);r.rej+=num(p.rej);r.good+=p.good});
  return r;
}
function agg(ws){
  const a={jobs:ws.length,bd:0,pm:0,oth:0,manHrs:0,mp:0,spare:0,cons:0,ext:0,other:0,othCost:0,total:0,dt:0,bdDt:0,byType:{}};
  ws.forEach(w=>{
    if(w.type==='Breakdown'){a.bd++;a.bdDt+=w.dt}else if(w.type==='Preventive')a.pm++;else a.oth++;
    a.manHrs+=w.manHrs;a.mp+=w.mp;a.spare+=w.spare;a.cons+=num(w.cons);a.ext+=num(w.ext);a.other+=num(w.other);a.othCost+=w.othCost;a.total+=w.total;a.dt+=w.dt;
    a.byType[w.type]=(a.byType[w.type]||0)+w.total;
  });
  a.mttr=a.bd?a.bdDt/a.bd:null;return a;
}
function latestDate(){let d='';C.wos.forEach(w=>{if(w.date>d)d=w.date});C.prod.forEach(p=>{if(p.date>d)d=p.date});return d||todayISO()}
/* ---------- financial years (any FY, any start month) ---------- */
const fySM=()=>{const m=Math.floor(num(S.settings.fyStartMonth));return m>=1&&m<=12?m:4};
function fyOf(date){let y=+date.slice(0,4);if(+date.slice(5,7)<fySM())y--;return y}
const fyStartOf=y=>`${y}-${String(fySM()).padStart(2,'0')}-01`;
const fyEndOf=y=>monthEnd(addMonths(mKey(fyStartOf(y)),11));
const fyName=y=>fySM()===1?String(y):`${y}-${String((y+1)%100).padStart(2,'0')}`;
function fyMonths(y){y=y??UI.fy;const s=mKey(fyStartOf(y));return Array.from({length:12},(_,i)=>addMonths(s,i))}
function fyList(){
  const ys=new Set([fyOf(todayISO())]);C.wos.forEach(w=>ys.add(fyOf(w.date)));C.prod.forEach(p=>ys.add(fyOf(p.date)));
  Object.keys(S.fyTargets||{}).forEach(y=>ys.add(+y));if(UI.fy!=null)ys.add(UI.fy);
  const a=[...ys].sort((x,y)=>x-y);const mx=a[a.length-1];a.push(mx+1);return a;
}
function lastDateInFy(y){const f=fyStartOf(y),t=fyEndOf(y);let d='';C.wos.forEach(w=>{if(inR(w.date,f,t)&&w.date>d)d=w.date});C.prod.forEach(p=>{if(inR(p.date,f,t)&&p.date>d)d=p.date});return d}
function setFy(y){y=+y;UI.fy=y;const d=lastDateInFy(y);UI.month=d?mKey(d):mKey(fyStartOf(y));UI.date=d||(inR(todayISO(),fyStartOf(y),fyEndOf(y))?todayISO():fyStartOf(y));UI.wo.from='';UI.wo.to='';UI.pm='All';render()}
function fySelect(){return `<label class="tsel">Financial year<select onchange="setFy(this.value)" aria-label="Financial year">${fyList().map(y=>`<option value="${y}" ${y===UI.fy?'selected':''}>FY ${fyName(y)}</option>`).join('')}</select></label>`}
function monthStats(k){
  const f=k+'-01',t=monthEnd(k),a=agg(wosIn(f,t)),p=prodIn(f,t);
  const ys=fyStartOf(fyOf(f)),ya=agg(wosIn(ys,t)),yp=prodIn(ys,t);
  return{k,a,p,cpu:p.good?a.total/p.good:null,ytdCost:ya.total,ytdGood:yp.good,ytdCpu:yp.good?ya.total/yp.good:null,hasData:a.jobs>0||p.total>0};
}
function range(){const k=UI.month;return UI.period==='YTD'?[fyStartOf(fyOf(k+'-01')),monthEnd(k)]:[k+'-01',monthEnd(k)]}
function fyT(y){return (S.fyTargets||{})[y]||{}}
const rTypes=()=>{const s=[...S.workTypes];C.wos.forEach(w=>{if(w.type&&!s.includes(w.type))s.push(w.type)});return s};
const tgt=(y=UI.fy)=>{const o=fyT(y).target;return o!==''&&o!=null?num(o):num(S.settings.target)};
const bud=(y=UI.fy)=>{const o=fyT(y).budget;return o!==''&&o!=null?num(o):num(S.settings.budget)};
const status=(v,t)=>v==null?'<span class="muted">No production</span>':v>t?`<span class="pill bad">Above target</span>`:`<span class="pill ok">Within target</span>`;

function badges(){
  const b={};const open=S?S.wos.filter(w=>w.status!=='Completed').length:0;if(open)b.wo=open;
  if(S){const n=fyMonths().map(monthStats).filter(s=>s.cpu!=null&&s.cpu>tgt()&&!(S.deviations[s.k]||{}).reason).length;if(n)b.mis=n}
  return b;
}
const VIEWS={daily:vDaily,kpi:vKpi,mis:vMis,machines:vMachines,spares:vSpares,manpower:vManpower,wo:vWo,production:vProd,masters:vMasters};

let VIEW=null;

function renderNav(){const b=badges();$('#nav').innerHTML=NAV.map(([g,items])=>`<h6>${g}</h6>`+items.map(([id,l])=>`<a href="#${id}" onclick="return go('${id}')" class="${cur()===id?'on':''}" ${cur()===id?'aria-current="page"':''}>${ico(id)}${l}${b[id]?`<span class="bdg" title="${id==='wo'?'Open work orders':'Months above target without a deviation reason'}">${b[id]}</span>`:''}</a>`).join('')).join('')}
function render(){

/* ---------- Monthly KPI dashboard ---------- */
function vKpi(){

  const cpu=st.cpu,over=cpu!=null&&cpu>T;
  const max=Math.max(T*1.6,(cpu||0)*1.1),w=cpu==null?0:Math.min(100,cpu/max*100),tp=T/max*100;
  const dev=S.deviations[k]||{};
  const fyLabel=`FY ${fyName(fyOf(k+'-01'))}`;
  return head('Monthly maintenance KPI',`${mLong(k)}, ${fyLabel}`,monthSel(false))+
  `<div class="meter ${over?'over':''}"><div><div class="cap">Maintenance cost per good unit</div><div class="big"><small>₹</small>${cpu==null?'–':inr(cpu,2)}</div></div>
   <div><div class="track" role="img" aria-label="Cost per unit against target"><div class="fill ${over?'bad':''}" style="width:${w}%"></div><div class="tick" style="left:calc(${tp}% - 1px)"><span>Target ₹${inr(T,2)}</span></div></div>
   <div class="scale"><span>₹0</span><span>₹${inr(max,2)}</span></div>
   <div class="side2"><div><b>${status(cpu,T)}</b>Status</div><div><b>${cpu==null?'–':(cpu-T>0?'+':'')+inr(cpu-T,2)}</b>Variance ₹/unit</div><div><b>${rs2(st.ytdCpu)}</b>YTD cost per unit</div></div></div></div>`+
  `<h2>Cost and output</h2><div class="tiles">`+
   tile('Good production',inr(st.p.good),'ok','Nos')+tile('Total maintenance cost',rs(a.total))+tile('Monthly budget',rs(B))+
   tile('Actual vs budget',pct(B?a.total/B:null),B&&a.total>B?'bad':'ok',B?`${a.total>B?'Over':'Under'} by ${rs(Math.abs(a.total-B))}`:'')+
   tile('YTD maintenance cost',rs(st.ytdCost))+tile('YTD good production',inr(st.ytdGood))+
  `</div><h2>Activity</h2><div class="tiles">`+
   tile('Total jobs',a.jobs)+tile('Breakdown jobs',a.bd,a.bd?'bad':'')+tile('PM jobs',a.pm,'ok')+tile('Man-hours',hr(a.manHrs))+tile('Breakdown downtime',hr(a.bdDt)+' h',a.bdDt?'warn':'')+tile('MTTR',a.mttr==null?'–':hr(a.mttr)+' h','','Downtime ÷ breakdown jobs')+

   row('YTD maintenance cost','₹',s=>blank(s,inr(s.ytdCost)),inr(totA.total))+row('YTD good production','Nos',s=>blank(s,inr(s.ytdGood)),inr(totP.good))+
   row('YTD cost per good unit','₹/unit',s=>s.hasData&&s.ytdCpu!=null?inr(s.ytdCpu,2):'',ytdCpu==null?'':inr(ytdCpu,2));
  h+=sec('Cost by work type')+rTypes().map(t=>row(t,'₹',s=>inr(s.a.byType[t]||0),inr(totA.byType[t]||0))).join('')+

function rMachines(W){const l=S.machines.slice();W.forEach(w=>{if(w.machine&&!l.some(m=>m.no===w.machine))l.push({no:w.machine,name:'(not in machine master)',dept:'',line:''})});return l}

   `<div class="grid2" style="margin-top:22px"><div><h2>Top 5 costly machines</h2>${top.length?`<div class="scroll"><table><thead><tr><th class="n">Rank</th><th>Machine</th><th class="n">Total cost</th><th class="n">₹/unit</th></tr></thead><tbody>${top.map(r=>`<tr><td class="n">${r.rank}</td><td>${esc(r.m.no)} <span class="muted">${esc(r.m.name)}</span></td><td class="n">${inr(r.a.total)}</td><td class="n">${r.cpu==null?'–':inr(r.cpu,2)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="panel muted">No cost in this period.</div>'}</div>
   <div class="panel"><h2>Total cost by machine</h2><div class="chart"><canvas id="m1"></canvas></div></div></div>`;

/* ---------- Spare cost ---------- */
function vSpares(){
  const[f,t]=range();const nos=new Set(wosIn(f,t).map(w=>w.no));const W=Object.fromEntries(C.wos.map(w=>[w.no,w]));
  const iss=S.spareIssues.filter(s=>nos.has(s.wo));
  const by={};iss.forEach(s=>{const b=by[s.spare]=by[s.spare]||{qty:0,amt:0};b.qty+=num(s.qty);b.amt+=num(s.qty)*num(s.rate)});
  const names=[...new Set([...S.spares.map(s=>s.name),...Object.keys(by)])];
  const tot=Object.values(by).reduce((s,b)=>s+b.amt,0),totQ=Object.values(by).reduce((s,b)=>s+b.qty,0);
  const rank=Object.entries(by).filter(([,b])=>b.amt>0).sort((a,b)=>b[1].amt-a[1].amt).map(([n])=>n);
  const woSpare=agg(wosIn(f,t)).spare;
  const sm=Object.fromEntries(S.spares.map(s=>[s.name,s]));
  return head('Spare consumption and cost',`${fmtDate(f)} to ${fmtDate(t)}.`,monthSel(true),`${expBtn('main table','Spare_cost').replace('btn sm','btn')} ${upBtn('issues','Bulk upload')} <button class="btn pri" onclick="issueDialog()">${ico('plus')}Issue spare</button>`)+
   `<div class="grid2"><div class="scroll"><table><thead><tr><th>Spare</th><th>UOM</th><th class="n">Unit cost</th><th class="n">Qty used</th><th class="n">Amount</th><th class="n">Share</th><th class="n">Rank</th></tr></thead><tbody>`+
   names.map(n=>{const b=by[n]||{qty:0,amt:0};const r=rank.indexOf(n)+1;return `<tr><td>${esc(n)}</td><td>${esc(sm[n]?.uom||'')}</td><td class="n">${inr(sm[n]?.cost||0)}</td><td class="n">${inr(b.qty,b.qty%1?2:0)}</td><td class="n">${inr(b.amt)}</td><td class="n">${tot?pct(b.amt/tot):''}</td><td class="n">${r||''}</td></tr>`}).join('')+
   `<tr class="tot"><td colspan="3">Total</td><td class="n">${inr(totQ)}</td><td class="n">${inr(tot)}</td><td class="n">${tot?'100%':''}</td><td></td></tr></tbody></table></div>
   <div><div class="tiles" style="margin-bottom:16px">${tile('Spare cost in work orders',rs(woSpare))}${tile('Difference',rs(woSpare-tot),Math.abs(woSpare-tot)<0.5?'ok':'bad','Should be 0')}</div>
   <h2>Top 5 spares by cost</h2>${rank.length?`<div class="scroll"><table><thead><tr><th class="n">Rank</th><th>Spare</th><th class="n">Amount</th></tr></thead><tbody>${rank.slice(0,5).map((n,i)=>`<tr><td class="n">${i+1}</td><td>${esc(n)}</td><td class="n">${inr(by[n].amt)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="panel muted">No spares issued in this period.</div>'}</div></div>`+
   `<h2>Spare issue log <small>${iss.length} issues in this period</small></h2>`+(iss.length?`<div class="scroll"><table><thead><tr><th>WO no</th><th>Issue date</th><th>Machine</th><th>Spare</th><th>UOM</th><th class="n">Qty</th><th class="n">Unit cost</th><th class="n">Amount</th><th>Remarks</th><th></th></tr></thead><tbody>`+
   iss.slice().sort((a,b)=>(W[a.wo]?.date||'').localeCompare(W[b.wo]?.date||'')).map(s=>`<tr class="click" onclick="woDialog(${ja(s.wo)})"><td>${esc(s.wo)}</td><td>${fmtDate(W[s.wo]?.date)}</td><td>${esc(W[s.wo]?.machine)}</td><td>${esc(s.spare)}</td><td>${esc(sm[s.spare]?.uom||'')}</td><td class="n">${s.qty}</td><td class="n">${inr(s.rate)}</td><td class="n">${inr(num(s.qty)*num(s.rate))}</td><td>${esc(s.remarks)}</td><td class="n"><button class="btn sm" onclick="event.stopPropagation();issueDialog('${s.id}')">Edit</button> <button class="btn sm danger" onclick="event.stopPropagation();delIssue('${s.id}')">Delete</button></td></tr>`).join('')+`</tbody></table></div><p class="legend">Spares can be issued here or inside a work order. Select a row to open its work order.</p>`:'<div class="scroll"><div class="empty">No spares issued in this period.</div></div>');
}

/* ---------- Manpower ---------- */

  const[f,t]=range();const W=wosIn(f,t),a=agg(W);
  const cat=CATS.map(([k,c])=>{const mh=W.reduce((s,w)=>s+num(w[k])*w.wh,0);return{c,rate:num(S.rates[c]),mh,cost:mh*num(S.rates[c])}});
  const cTot=cat.reduce((s,x)=>s+x.cost,0),mhTot=cat.reduce((s,x)=>s+x.mh,0);
  const wt=rTypes().map(ty=>{const x=agg(W.filter(w=>w.type===ty));return{ty,x}});
  return head('Manpower utilisation and cost',`${fmtDate(f)} to ${fmtDate(t)}. Rates come from Masters.`,monthSel(true),`${expBtn('main table','Manpower_cost').replace('btn sm','btn')}`)+
   `<div class="grid2"><div><h2>By skill category</h2><div class="scroll"><table><thead><tr><th>Category</th><th class="n">Rate / hr</th><th class="n">Man-hours</th><th class="n">Cost</th><th class="n">Share</th></tr></thead><tbody>`+
   cat.map(x=>`<tr><td>${x.c}</td><td class="n">${inr(x.rate)}</td><td class="n">${hr(x.mh)}</td><td class="n">${inr(x.cost)}</td><td class="n">${cTot?pct(x.cost/cTot):''}</td></tr>`).join('')+
   `<tr class="tot"><td colspan="2">Total</td><td class="n">${hr(mhTot)}</td><td class="n">${inr(cTot)}</td><td class="n">${cTot?'100%':''}</td></tr></tbody></table></div>
   <p class="legend">Check against work orders: ${rs(a.mp)}, difference ${rs(a.mp-cTot)}.</p></div>
   <div><h2>By work type</h2><div class="scroll"><table><thead><tr><th>Work type</th><th class="n">Jobs</th><th class="n">Man-hours</th><th class="n">Cost</th><th class="n">Avg man-hrs / job</th><th class="n">Share</th></tr></thead><tbody>`+
   wt.map(({ty,x})=>`<tr><td>${esc(ty)}</td><td class="n">${x.jobs}</td><td class="n">${hr(x.manHrs)}</td><td class="n">${inr(x.mp)}</td><td class="n">${x.jobs?hr(x.manHrs/x.jobs):''}</td><td class="n">${a.mp?pct(x.mp/a.mp):''}</td></tr>`).join('')+
   `<tr class="tot"><td>Total</td><td class="n">${a.jobs}</td><td class="n">${hr(a.manHrs)}</td><td class="n">${inr(a.mp)}</td><td class="n">${a.jobs?hr(a.manHrs/a.jobs):''}</td><td class="n">${a.mp?'100%':''}</td></tr></tbody></table></div></div></div>`;

const PERIODS=[{v:'FY',l:'Financial year (2627)'},{v:'YYYY',l:'Calendar year (2026)'},{v:'YYMM',l:'Year + month (2609)'},{v:'none',l:'None (never restarts)'}];
const SEPS=[{v:'-',l:'Dash  -'},{v:'/',l:'Slash  /'},{v:'',l:'None'}];
function fyCode(date){const y=fyOf(date);return fySM()===1?String(y%100).padStart(2,'0'):String(y%100).padStart(2,'0')+String((y+1)%100).padStart(2,'0')}
function periodCode(p,date){return p==='FY'?fyCode(date):p==='YYYY'?date.slice(0,4):p==='YYMM'?date.slice(2,4)+date.slice(5,7):''}
function seriesFor(type){const s=(S.series||{})[type];return s&&s.prefix?s:null}
function woBase(date,type){const s=seriesFor(type);if(!s)return `WO-${date.slice(0,4)}-${date.slice(5,7)}${date.slice(8,10)}-`;return [s.prefix,periodCode(s.period,date)].filter(Boolean).join(s.sep)+s.sep}
function serLabel(k){const s=seriesFor(k);if(!s)return k;const t=S.workTypes.filter(ty=>{const x=seriesFor(ty);return x&&x.prefix===s.prefix&&x.period===s.period&&x.sep===s.sep});return t.join(', ')||k}
function nextWoNo(date,type,skip){
  const s=seriesFor(type),base=woBase(date,type),dg=s?Math.max(1,num(s.digits)||4):3;
  let mx=s?Math.max(0,num(s.start)-1):0;
  S.wos.forEach(w=>{if(w===skip||!w.no.startsWith(base))return;const r=w.no.slice(base.length);if(/^\d+$/.test(r))mx=Math.max(mx,+r)});
  let n=mx+1,no=base+String(n).padStart(dg,'0');
  while(S.wos.some(w=>w!==skip&&w.no===no)){n++;no=base+String(n).padStart(dg,'0')}
  return no;
}

    if(r.end&&r.end===r.start){toast('End time is the same as start time. Check the times.');return}
    if(!r.dtStart&&r.dtEnd){toast('Enter the downtime start too, or clear the downtime end.');return}
    if(done&&r.dtStart&&!r.dtEnd){toast('Enter the downtime end to complete the work order, or set the status to Open / In Progress.');return}
    if(r.dtStart&&r.dtEnd&&r.dtStart===r.dtEnd){toast('Downtime end is the same as downtime start. Check the times.');return}
    const neg=['mgr','eng','tech','elec','helper','cons','ext','other'].find(k=>num(r[k])<0);if(neg){toast('Crew counts and costs cannot be negative.');return}
    if(lines.some(l=>num(l.qty)<0)){toast('Spare quantity cannot be negative.');return}
    const good=lines.filter(l=>l.spare&&num(l.qty)>0);
    let no=manualNo?$('#w_no').value.trim():nextWoNo(r.date,pick||r.type,ex);
    if(!no){toast('Enter a WO number or use the automatic one.');return}
    if(S.wos.some(x=>x!==ex&&x.no.toLowerCase()===no.toLowerCase())){toast(`${no} is already used. Choose another number.`);return}
    const oldNo=ex?ex.no:null;
    if(ex){Object.assign(ex,r);ex.no=no}else{r.no=no;S.wos.push(r)}
    const key=no;
    S.spareIssues=S.spareIssues.filter(s=>s.wo!==key&&s.wo!==oldNo).concat(good.map(l=>({id:l.id||uid(),wo:key,spare:l.spare,qty:num(l.qty),rate:num(l.rate),remarks:l.remarks||''})));
    let learned=0;if(S.msAuto!==false)good.forEach(l=>{if(msAdd(r.machine,l.spare,l.qty))learned++});
    let fyMsg='';if(fyOf(r.date)!==UI.fy){UI.fy=fyOf(r.date);UI.month=mKey(r.date);UI.wo.from='';UI.wo.to='';fyMsg=`. Showing FY ${fyName(UI.fy)}`}
    d.close();save((ex?`${key} saved`:`${key} added`)+fyMsg+(learned?`. ${learned} new spare${learned>1?'s':''} added to the ${r.machine} spares list`:''));
  };
  if(ex)$('#wDel').onclick=async()=>{if(!await ask(`Delete ${ex.no}?`,'The work order and its spare issues will be removed.','Delete work order',true))return;S.wos=S.wos.filter(x=>x!==ex);S.spareIssues=S.spareIssues.filter(s=>s.wo!==ex.no);d.close();save(`${ex.no} deleted`)};
  d.showModal();
}

/* ---------- Excel import / export ---------- */
function xDate(v){if(v==null||v==='')return'';if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  if(v instanceof Date)return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);{const p=parseDateText(s);if(p)return p}const m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3}|\d{1,2})[-\/ ](\d{4})$/);
  if(m){const mo=isNaN(m[2])?MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase())+1:+m[2];return `${m[3]}-${String(mo).padStart(2,'0')}-${m[1].padStart(2,'0')}`}return''}
function xTime(v){if(v==null||v==='')return'';if(typeof v==='number'){const mm=Math.round((v%1)*1440);return `${String(Math.floor(mm/60)%24).padStart(2,'0')}:${String(mm%60).padStart(2,'0')}`}
  const m=String(v).match(/(\d{1,2}):(\d{2})/);return m?`${m[1].padStart(2,'0')}:${m[2]}`:''}
function sheetRows(wb,name,firstHeader){
  const ws=wb.Sheets[name];if(!ws)return null;const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const hi=a.findIndex(r=>String(r[0]).trim()===firstHeader);if(hi<0)return null;
  const H=a[hi].map(h=>String(h).trim());return a.slice(hi+1).map(r=>Object.fromEntries(H.map((h,i)=>[h,r[i]])));
}
async function importXlsx(file){

}
function readMaster(wb){
  const ws=wb.Sheets['Master Data'];if(!ws)return null;const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const find=(txt,col)=>a.findIndex(r=>String(r[col]).trim()===txt);
  const block=(r0,col,n)=>{const out=[];if(r0<0)return out;for(let i=r0+1;i<a.length;i++){const v=a[i].slice(col,col+n);if(String(v[0]).trim()==='')break;out.push(v)}return out};
  const lists={};
  const mi=find('Machine No',0);const machines=block(mi,0,4).map(v=>({no:String(v[0]).trim(),name:String(v[1]),dept:String(v[2]),line:String(v[3])}));if(machines.length)lists.machines=machines;
  const si=find('Spare Name',5);const spares=block(si,5,3).map(v=>({name:String(v[0]).trim(),uom:String(v[1]),cost:num(v[2])}));if(spares.length)lists.spares=spares;
  const ci=find('Category',5);const rates={};block(ci,5,2).forEach(v=>{if(CATS.some(([,c])=>c===String(v[0]).trim()))rates[String(v[0]).trim()]=num(v[1])});
  const col=(hdr,c)=>{const i=find(hdr,c);return block(i,c,1).map(v=>String(v[0]).trim()).filter(Boolean)};
  const wt=col('Work Type',10);if(wt.length)lists.workTypes=wt;const sh=col('Shift',12);if(sh.length)lists.shifts=sh;const st=col('Status',14);if(st.length)lists.statuses=st;const dr=col('Deviation Reason',16);if(dr.length)lists.devReasons=dr;
  const settings={};a.forEach(r=>{const k=String(r[0]).trim(),v=r[1];if(k==='FY Start Date'){const dd=xDate(v);if(dd)settings.fyStartMonth=+dd.slice(5,7)}if(k==='FY Start Month')settings.fyStartMonth=num(v);if(k.startsWith('Target Maint'))settings.target=num(v);if(k.startsWith('Monthly Maintenance Budget'))settings.budget=num(v)});
  return{lists,rates:Object.keys(rates).length?rates:null,settings:Object.keys(settings).length?settings:null};
}

function tplRead(key,wb){
  const T=TPL[key];let ws=wb.Sheets[T.sheet];if(!ws){const n=wb.SheetNames.find(n=>n!=='Instructions'&&n!=='Allowed values');ws=wb.Sheets[n]}
  if(!ws)throw 'The file has no sheets.';

  const want=T.cols.map(([h])=>nk(h));const hi=a.findIndex(r=>r.some(c=>nk(c)===want[0])&&r.filter(c=>want.includes(nk(c))).length>=Math.min(2,want.length));
  if(hi<0)throw `Header row not found. The first row must have the template headers, starting with "${T.cols[0][0]}".`;
  const H=a[hi].map(nk),idx=want.map(w=>H.indexOf(w));
  const miss=T.cols.filter((c,i)=>c[1]&&idx[i]<0).map(c=>c[0]);if(miss.length)throw `Required column missing: ${miss.join(', ')}.`;

      return `<tr><td>${esc(T.title)}</td><td class="wrap muted">${T.cols.map(c=>esc(c[0])+(c[1]?' *':'')).join(', ')}</td><td class="n">${n}</td><td class="n" style="white-space:nowrap"><button class="btn sm" onclick="tplDownload('${k}',false)">${ico('down')}Blank</button> <button class="btn sm" onclick="tplDownload('${k}',true)">${ico('down')}With data</button> <button class="btn sm pri" onclick="uploadDialog('${k}')">${ico('up')}Upload</button></td></tr>`}).join('')+`</tbody></table></div>`).join('')+
   `<p class="legend">Upload order for a fresh start: machines and spares first, then work orders, then spare issues and production, because later sheets refer to earlier ones.</p>`;
}

/* ---------- machine-wise spares list ---------- */
function usualQty(qs){const c={};qs.forEach(q=>{q=num(q)||1;c[q]=(c[q]||0)+1});return +Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0]-b[0])[0][0]}
function msBuildFromHistory(){
  const W=Object.fromEntries(S.wos.map(w=>[w.no,w])),g={};
  S.spareIssues.forEach(s=>{const m=W[s.wo]?.machine;if(!m||!s.spare)return;(g[m+'|'+s.spare]=g[m+'|'+s.spare]||{machine:m,spare:s.spare,qs:[]}).qs.push(s.qty)});
  return Object.values(g).map(x=>({machine:x.machine,spare:x.spare,qty:usualQty(x.qs),note:''}));
}
function msUsage(machine){
  const W=Object.fromEntries(S.wos.map(w=>[w.no,w])),u={};
  S.spareIssues.forEach(s=>{const w=W[s.wo];if(!w||w.machine!==machine)return;const x=u[s.spare]=u[s.spare]||{times:0,qty:0,amt:0,last:'',qs:[]};x.times++;x.qty+=num(s.qty);x.qs.push(s.qty);x.amt+=num(s.qty)*num(s.rate);if(w.date>x.last)x.last=w.date});
  return u;
}
const msList=machine=>S.mspares.filter(x=>x.machine===machine).sort((a,b)=>a.spare.localeCompare(b.spare));
const msHas=(machine,spare)=>S.mspares.some(x=>x.machine===machine&&x.spare===spare);
function msAdd(machine,spare,qty,note){if(!machine||!spare||msHas(machine,spare))return false;S.mspares.push({machine,spare,qty:num(qty)||1,note:note||''});return true}
const msCount=machine=>S.mspares.filter(x=>x.machine===machine).length;
/* grouped <option>s: this machine's spares first */
function spareOptions(machine,selected,blank=true){
  const sm=new Set(S.spares.map(s=>s.name)),mine=msList(machine).filter(x=>sm.has(x.spare)).map(x=>x.spare),rest=S.spares.map(s=>s.name).filter(n=>!mine.includes(n));
  const op=n=>`<option value="${esc(n)}" ${n===selected?'selected':''}>${esc(n)}</option>`;
  return (blank?`<option value="">Select spare</option>`:'')+(mine.length?`<optgroup label="Spares for ${esc(machine)}">${mine.map(op).join('')}</optgroup><optgroup label="All other spares">${rest.map(op).join('')}</optgroup>`:rest.map(op).join(''));
}
/* quick-pick buttons for a machine */
function spareChips(machine,inUse){
  const list=msList(machine),sm=Object.fromEntries(S.spares.map(s=>[s.name,s])),u=msUsage(machine);
  if(!machine)return '';
  if(!list.length)return `<div class="chips-empty">No spares listed for ${esc(machine)} yet. Pick from "Add spare"; spares you use here are remembered for next time.</div>`;
  return `<div class="chips-h">Spares for ${esc(machine)} <span class="muted">tap to add</span></div><div class="chips">`+list.map(x=>{const on=inUse&&inUse.includes(x.spare);return `<button type="button" class="chip${on?' on':''}" data-chip="${esc(x.spare)}" data-q="${x.qty}" title="${esc(sm[x.spare]?`₹${inr(sm[x.spare].cost)} per ${sm[x.spare].uom}`:'Not in spare master')}${u[x.spare]?`, used ${u[x.spare].times} times, last ${fmtDate(u[x.spare].last)}`:''}${x.note?`, ${x.note}`:''}">${on?'✓ ':'+ '}${esc(x.spare)}${num(x.qty)!==1?` <small>×${x.qty}</small>`:''}</button>`}).join('')+`</div>`;
}
/* ---- Masters tab ---- */
function setMsm(v){UI.msm=v;render()}
function mMSpares(){
  if(!S.machines.length)return `<div class="panel muted">Add machines first.</div>`;
  if(!UI.msm||!findM(UI.msm))UI.msm=S.machines[0].no;
  const m=findM(UI.msm),list=msList(m.no),u=msUsage(m.no),sm=Object.fromEntries(S.spares.map(s=>[s.name,s]));
  const hist=Object.keys(u).filter(s=>!msHas(m.no,s));
  const fyF=fyStartOf(UI.fy),fyE=fyEndOf(UI.fy),fyAmt=S.spareIssues.reduce((a,s)=>{const w=S.wos.find(x=>x.no===s.wo);return w&&w.machine===m.no&&inR(w.date,fyF,fyE)?a+num(s.qty)*num(s.rate):a},0);
  const tot=list.reduce((a,x)=>a+num(x.qty)*num(sm[x.spare]?.cost),0);
  return `<div class="filters" style="margin-top:-4px">`+seg('Machine',S.machines.map(x=>({v:x.no,l:`${x.no} (${msCount(x.no)})`})),m.no,'setMsm')+`</div>
   <div class="thead"><h2>${esc(m.no)} <small>${esc(m.name)}${m.dept?', '+esc(m.dept):''}</small></h2><div class="ctl">
    ${hist.length?`<button class="btn" onclick="msFromHistory(${ja(m.no)})">Add ${hist.length} from usage history</button>`:''}
    <button class="btn" onclick="msCopyDialog(${ja(m.no)})">Copy from another machine</button>
    <button class="btn pri" onclick="msPickDialog(${ja(m.no)})">${ico('plus')}Add spares</button></div></div>
   <div class="tiles" style="margin-bottom:14px">${tile('Spares listed',list.length)}${tile('Value of one full set',rs(tot),'','Unit cost × usual qty')}${tile(`Spare cost FY ${fyName(UI.fy)}`,rs(fyAmt),'warn')}${tile('Used but not listed',hist.length,hist.length?'bad':'ok',hist.length?'Use "Add from usage history"':'List is complete')}</div>`+
   (list.length?`<div class="scroll"><table><thead><tr><th>Spare</th><th>UOM</th><th class="n">Unit cost ₹</th><th class="n">Usual qty per job</th><th>Note / location</th><th class="n">Times used</th><th class="n">Qty used</th><th>Last used</th><th></th></tr></thead><tbody>`+
    list.map(x=>{const s=sm[x.spare],k=S.mspares.indexOf(x),us=u[x.spare];return `<tr><td>${esc(x.spare)}${s?'':' <span class="pill bad">Not in spare master</span>'}</td><td>${esc(s?.uom||'')}</td><td class="n">${s?inr(s.cost,2):'–'}</td>
     <td class="n"><input type="number" min="0" step="any" style="width:80px" value="${x.qty}" onchange="msEdit(${k},'qty',this.value)" aria-label="Usual qty for ${esc(x.spare)}"></td>
     <td><input style="width:170px" value="${esc(x.note||'')}" placeholder="e.g. drive end, rack B2" onchange="msEdit(${k},'note',this.value)" aria-label="Note for ${esc(x.spare)}"></td>
     <td class="n">${us?us.times:0}</td><td class="n">${us?inr(us.qty,us.qty%1?2:0):0}</td><td>${us?fmtDate(us.last):'<span class="muted">Never</span>'}</td>
     <td class="n"><button class="btn sm danger" onclick="msRemove(${k})">Remove</button></td></tr>`}).join('')+`</tbody></table></div>`
    :`<div class="scroll"><div class="empty">No spares listed for ${esc(m.no)}. Use "Add spares"${hist.length?' or "Add from usage history"':''}.</div></div>`)+
   `<p class="legend">These spares appear first, as one-tap buttons, when you enter a work order or issue a spare for this machine. ${S.msAuto!==false?'A spare used on this machine for the first time is added to its list automatically.':'Automatic adding is off.'} <a href="#" onclick="S.msAuto=${S.msAuto===false};save(S.msAuto?'New spares will be added automatically':'Automatic adding turned off');return false">${S.msAuto!==false?'Turn off':'Turn on'}</a></p>`;
}
function msEdit(k,f,v){const x=S.mspares[k];if(!x)return;x[f]=f==='qty'?(num(v)||1):String(v).trim();save('Saved')}
async function msRemove(k){const x=S.mspares[k];if(!x)return;if(!await ask(`Remove ${x.spare} from ${x.machine}?`,'Only the link is removed. The spare stays in the spare master and past issues are not changed.','Remove',true))return;S.mspares.splice(k,1);save(`${x.spare} removed from ${x.machine}`)}
function msFromHistory(machine){const u=msUsage(machine);let n=0;Object.entries(u).forEach(([s,x])=>{if(msAdd(machine,s,usualQty(x.qs)))n++});save(`${n} spares added to ${machine} from usage history`)}
function msPickDialog(machine){
  const d=$('#dlg');const sel=new Map();
  const draw=q=>{const ql=(q||'').toLowerCase();const avail=S.spares.filter(s=>!msHas(machine,s.name)&&(!ql||s.name.toLowerCase().includes(ql)));
    $('#pk_list').innerHTML=avail.length?avail.map(s=>`<label class="pick-row"><input type="checkbox" data-s="${esc(s.name)}" ${sel.has(s.name)?'checked':''}><span>${esc(s.name)}</span><span class="muted">${esc(s.uom)} · ₹${inr(s.cost)}</span><input type="number" min="0" step="any" data-q="${esc(s.name)}" value="${sel.get(s.name)??1}" aria-label="Usual qty" title="Usual qty per job"></label>`).join(''):`<div class="empty">${S.spares.every(s=>msHas(machine,s.name))?'Every spare in the master is already listed for this machine.':'No spare matches.'} <a href="#" id="pk_new">Create a new spare</a></div>`;
    $$('#pk_list [data-s]').forEach(c=>c.onchange=()=>{const n=c.dataset.s;if(c.checked)sel.set(n,num($(`#pk_list [data-q="${CSS.escape(n)}"]`).value)||1);else sel.delete(n);cnt()});
    $$('#pk_list [data-q]').forEach(i=>i.oninput=()=>{const n=i.dataset.q;if(sel.has(n))sel.set(n,num(i.value)||1);else{sel.set(n,num(i.value)||1);$(`#pk_list [data-s="${CSS.escape(n)}"]`).checked=true}cnt()});
    const nw=$('#pk_new');if(nw)nw.onclick=e=>{e.preventDefault();d.close();spareDialog()};};
  const cnt=()=>{$('#pk_ok').textContent=sel.size?`Add ${sel.size} spare${sel.size>1?'s':''}`:'Add spares';$('#pk_ok').disabled=!sel.size};
  d.innerHTML=`<div class="dh"><h3>Add spares to ${esc(machine)}</h3><button class="btn sm" onclick="$('#dlg').close()">Close</button></div>
   <div style="padding:14px 20px"><input id="pk_q" placeholder="Search spares" style="width:100%" autocomplete="off"><div id="pk_list" class="pick-list"></div>
   <p class="legend">Tick the spares that fit this machine and set the usual quantity per job. Missing a spare? Add it in Masters → Spares first.</p></div>
   <div class="df"><span></span><div><button class="btn" onclick="$('#dlg').close()">Cancel</button> <button class="btn pri" id="pk_ok" disabled>Add spares</button></div></div>`;
  $('#pk_q').oninput=e=>draw(e.target.value);draw('');cnt();
  $('#pk_ok').onclick=()=>{let n=0;sel.forEach((q,s)=>{if(msAdd(machine,s,q))n++});d.close();save(`${n} spare${n===1?'':'s'} added to ${machine}`)};
  d.showModal();setTimeout(()=>$('#pk_q').focus(),30);
}
function msCopyDialog(machine){
  const others=S.machines.filter(m=>m.no!==machine&&msCount(m.no));
  if(!others.length){toast('No other machine has a spares list yet.');return}
  formDialog(`Copy spares list to ${esc(machine)}`,[['src','Copy from','select','w2',others.map(m=>({v:m.no,l:`${m.no} ${m.name} (${msCount(m.no)} spares)`}))],['info','Only spares not already listed are added. Useful for identical machines.','info','full']],{src:others[0].no},'Copy spares',v=>{
    let n=0;msList(v.src).forEach(x=>{if(msAdd(machine,x.spare,x.qty,x.note))n++});save(`${n} spares copied from ${v.src} to ${machine}`);
  });
}
TPL.mspares={title:'Machine-wise spares',sheet:'Machine Spares',modes:['merge','replace'],
  cols:[['Machine No',1,'Must exist in Machines'],['Spare Name',1,'Must exist in Spares'],['Usual Qty',0,'Per job, default 1'],['Note',0,'Position, location, part no…']],
  rows:()=>S.mspares.slice().sort((a,b)=>a.machine.localeCompare(b.machine)||a.spare.localeCompare(b.spare)).map(x=>[x.machine,x.spare,x.qty,x.note]),
  parse:r=>{const m=findM(r[0]);if(!m)throw `Machine "${sv(r[0])}" is not in Machines`;const s=S.spares.find(x=>x.name.toLowerCase()===sv(r[1]).toLowerCase());if(!s)throw `Spare "${sv(r[1])}" is not in Spares`;return{machine:m.no,spare:s.name,qty:r[2]===''?1:(cellNum(r[2],'Usual Qty')||1),note:sv(r[3])}},
  key:o=>(o.machine+'|'+o.spare).toLowerCase(),
  apply(list,mode){let a=0,u=0;if(mode==='replace'){S.mspares=list;return{a:list.length,u:0}}list.forEach(o=>{const e=S.mspares.find(x=>x.machine===o.machine&&x.spare===o.spare);if(e){Object.assign(e,o);u++}else{S.mspares.push(o);a++}});return{a,u}}};
TPL_GROUPS[0][1].splice(2,0,'mspares');

/* ---------- searchable drop-down (select[data-search]) ---------- */
const SS={el:null,sel:null,inp:null,all:[],view:[],act:-1};
const selDesc=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
function ssEnhanceAll(root){if(!root||!root.querySelectorAll)return;const l=[...root.querySelectorAll('select[data-search]:not([data-ss])')];if(root.matches&&root.matches('select[data-search]:not([data-ss])'))l.push(root);l.forEach(ssEnhance)}
function ssEnhance(sel){
  sel.dataset.ss='1';
  const wrap=document.createElement('span');wrap.className='ss-wrap';if(sel.style.width)wrap.style.width=sel.style.width;
  const inp=document.createElement('input');inp.type='text';inp.className='ss-in';inp.autocomplete='off';inp.spellcheck=false;
  inp.setAttribute('role','combobox');inp.setAttribute('aria-expanded','false');inp.setAttribute('aria-autocomplete','list');
  const lt=sel.closest('label')?.firstChild?.textContent?.trim();inp.setAttribute('aria-label',lt||'Search and choose');
  const ic=document.createElement('span');ic.className='ss-ic';ic.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>';
  wrap.append(inp,ic);sel.style.display='none';sel.after(wrap);sel._ss=inp;inp._sel=sel;
  Object.defineProperty(sel,'value',{configurable:true,get(){return selDesc.get.call(sel)},set(x){selDesc.set.call(sel,x);ssSync(sel)}});
  new MutationObserver(()=>{ssSync(sel);if(SS.sel===sel)ssBuild()}).observe(sel,{childList:true,subtree:true});
  ssSync(sel);
  inp.addEventListener('focus',()=>ssOpen(sel));
  inp.addEventListener('click',()=>{if(SS.sel!==sel)ssOpen(sel)});
  inp.addEventListener('input',()=>{if(SS.sel!==sel)ssOpen(sel);ssFilter(inp.value)});
  inp.addEventListener('keydown',ssKey);
  inp.addEventListener('blur',()=>setTimeout(()=>{if(SS.sel===sel&&!(SS.el&&SS.el.contains(document.activeElement)))ssClose()},150));
}
function ssSync(sel){const i=sel._ss;if(!i||SS.sel===sel)return;const o=sel.options[sel.selectedIndex];
  if(o&&o.value!==''){i.value=o.text.replace(/\s+/g,' ').trim();i.placeholder=''}else{i.value='';i.placeholder=(o&&o.text)||'Type to search'}}
function ssBuild(){const sel=SS.sel;SS.all=[];[...sel.children].forEach(c=>{if(c.tagName==='OPTGROUP')[...c.children].forEach(o=>SS.all.push({v:o.value,t:o.text.replace(/\s+/g,' ').trim(),g:c.label}));else if(c.value!=='')SS.all.push({v:c.value,t:c.text.replace(/\s+/g,' ').trim(),g:''})})}
function ssOpen(sel){
  if(SS.sel===sel&&SS.el)return;ssClose();SS.sel=sel;SS.inp=sel._ss;ssBuild();
  const el=document.createElement('div');el.className='ss';el.setAttribute('role','listbox');el.id='ss-list';
  el.addEventListener('mousedown',e=>e.preventDefault());
  el.addEventListener('click',e=>{const it=e.target.closest('[data-ix]');if(it)ssPick(+it.dataset.ix)});
  const co=sel.options[sel.selectedIndex];SS.inp.placeholder=co&&co.value!==''?co.text.replace(/\s+/g,' ').trim():'Type to search';SS.inp.value='';
  (SS.inp.closest('dialog')||document.body).appendChild(el);SS.el=el;SS.inp.setAttribute('aria-expanded','true');SS.inp.setAttribute('aria-controls','ss-list');
  ssFilter('',true);ssPlace();
}
function ssFilter(q,first){
  const words=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  SS.view=SS.all.filter(o=>{const h=(o.t+' '+o.g).toLowerCase();return words.every(w=>h.includes(w))});
  const cur=selDesc.get.call(SS.sel);SS.act=first?Math.max(0,SS.view.findIndex(o=>o.v===cur)):0;if(!SS.view.length)SS.act=-1;
  ssDraw(words);
}
function ssMark(t,words){let s=esc(t);words.forEach(w=>{if(!w)return;const re=new RegExp('('+esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');s=s.replace(re,'<mark>$1</mark>')});return s}
function ssDraw(words=[]){
  if(!SS.el)return;let g=null,h='';const cur=selDesc.get.call(SS.sel);
  SS.view.forEach((o,i)=>{if(o.g&&o.g!==g){g=o.g;h+=`<div class="ss-g">${esc(g)}</div>`}h+=`<div class="ss-o${i===SS.act?' act':''}${o.v===cur?' cur':''}" role="option" id="ss-o${i}" data-ix="${i}" aria-selected="${o.v===cur}">${ssMark(o.t,words)}</div>`});
  SS.el.innerHTML=`<div class="ss-h">${words.length?`${SS.view.length} of ${SS.all.length} match`:`${SS.all.length} items, type to search`}</div><div class="ss-l">${h||'<div class="ss-none">No match. Try fewer letters.</div>'}</div>`;
  if(SS.act>=0){SS.inp.setAttribute('aria-activedescendant','ss-o'+SS.act);const a=SS.el.querySelector('.act');if(a)a.scrollIntoView({block:'nearest'})}
}
function ssPlace(){if(!SS.el)return;const r=SS.inp.getBoundingClientRect();const w=Math.max(r.width,300);SS.el.style.width=Math.min(w,innerWidth-16)+'px';
  const below=innerHeight-r.bottom-12,above=r.top-12;const up=below<240&&above>below;const mh=Math.min(360,Math.max(160,up?above:below));
  SS.el.style.maxHeight=mh+'px';SS.el.querySelector('.ss-l')&&(SS.el.querySelector('.ss-l').style.maxHeight=(mh-34)+'px');
  SS.el.style.left=Math.max(8,Math.min(r.left,innerWidth-SS.el.offsetWidth-8))+'px';SS.el.style.top=(up?Math.max(8,r.top-SS.el.offsetHeight-4):r.bottom+4)+'px'}
function ssPick(i){const o=SS.view[i];if(!o)return;const sel=SS.sel,inp=SS.inp;ssClose();sel.value=o.v;sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}));ssSync(sel);inp.blur&&setTimeout(()=>{},0)}
function ssClose(){if(SS.el)SS.el.remove();const s=SS.sel;if(SS.inp)SS.inp.placeholder='';SS.el=null;SS.sel=null;if(SS.inp){SS.inp.setAttribute('aria-expanded','false');SS.inp.removeAttribute('aria-activedescendant')}SS.inp=null;if(s)ssSync(s)}
function ssKey(e){
  const sel=e.target._sel;if(SS.sel!==sel){if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();ssOpen(sel)}return}
  if(e.key==='ArrowDown'){e.preventDefault();if(SS.view.length){SS.act=Math.min(SS.view.length-1,SS.act+1);ssDraw(SS.inp.value.toLowerCase().split(/\s+/).filter(Boolean))}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(SS.view.length){SS.act=Math.max(0,SS.act-1);ssDraw(SS.inp.value.toLowerCase().split(/\s+/).filter(Boolean))}}
  else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();if(SS.act>=0)ssPick(SS.act)}
  else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();ssClose()}
  else if(e.key==='Tab'){if(SS.act>=0&&SS.inp.value&&SS.view.length&&SS.inp.value!==sel.options[sel.selectedIndex]?.text)ssPick(SS.act);else ssClose()}
}
document.addEventListener('mousedown',e=>{if(SS.el&&!SS.el.contains(e.target)&&e.target!==SS.inp)ssClose()},true);
window.addEventListener('resize',ssPlace);window.addEventListener('scroll',e=>{if(SS.el&&!SS.el.contains(e.target))ssPlace()},true);
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)ssEnhanceAll(n)}))).observe(document.documentElement,{childList:true,subtree:true});

boot();
